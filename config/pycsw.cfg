[server]
home=.
url=http://localhost:8000/csw
mimetype=application/xml; charset=UTF-8
encoding=UTF-8
language=en-US
maxrecords=25
loglevel=WARNING
logfile=
profiles=apiso
# CSW-T (transactions) and Harvest are OFF: the catalogue is read-only and is
# refreshed only by the stac2csw harvester.
# NOTE: do not set gzip_compresslevel. pycsw 2.6.2's WSGI wrapper sends the
# uncompressed Content-Length with a gzip body, which breaks clients such as OWSLib/QGIS.

[manager]
transactions=false
allowed_ips=127.0.0.1
csw_harvest_pagesize=10

[metadata:main]
identification_title=stac2csw: CSW catalogue for ISRO Bhoonidhi (unofficial)
identification_abstract=OGC CSW 2.0.2 view of the Bhoonidhi STAC catalogue. Metadata only; data is downloaded from Bhoonidhi after login.
identification_keywords=Bhoonidhi,ISRO,NRSC,remote sensing,STAC,CSW
identification_keywords_type=theme
identification_fees=None
identification_accessconstraints=None
provider_name=stac2csw (student project, not affiliated with NRSC/ISRO)
provider_url=https://github.com/ujjuNotGujju/stac2csw
contact_name=Ujjwal
contact_position=Maintainer
contact_address=IIIT Hyderabad
contact_city=Hyderabad
contact_stateorprovince=Telangana
contact_postalcode=500032
contact_country=India
contact_phone=
contact_fax=
contact_email=ujjwalguptaug0611@gmail.com
contact_url=https://github.com/ujjuNotGujju/stac2csw
contact_hours=
contact_instructions=
contact_role=pointOfContact

[repository]
database=sqlite:///data/records.db
table=records
